/* ===== ConsequenceEngine ===== */
const ConsequenceEngine={
 apply(o){const f=o[6];G.tension=clamp(G.tension+(f.t||0));G.pendingTasks+=f.p||0;G.unresolvedConflicts+=f.u||0;G.completedAgreements+=f.a||0;
  for(const k in (f.r||{}))G.relationships[k]=clamp(G.relationships[k]+f.r[k]);
  if(f.f)G.flags["flag_"+f.f]=true;
  o[3].split("").forEach((d,k)=>G.indicators[DK[k]]=clamp(G.indicators[DK[k]]+(d-1)*3))},
 extras(){const L=[],g=G,avg=Object.values(g.relationships).reduce((a,b)=>a+b)/4;
  if(g.pendingTasks>=2)L.push(N("Todavía hay documentos pendientes de los días anteriores. Antes de continuar, el equipo debe decidir cuál revisar primero: el informe de proveedores o el documento compartido."),["Armando","Revisemos primero el documento compartido; el informe puede esperar unos minutos."]);
  if(g.tension>=35)L.push(["Betty","Marcela, antes de seguir quiero aclarar algo: mi intención es resolver esto juntos, no señalar a nadie."],["Marcela","Está bien. Concentrémonos en lo que falta."]);
  if(g.completedAgreements>=4)L.push(N("Los acuerdos de los días anteriores le sirven al equipo como base: lo ya confirmado se retoma sin discutirlo de nuevo y la crisis se resuelve con mayor rapidez."));
  if(avg>=60)L.push(N("La relación cooperativa entre colegas permite una coordinación más fluida."));
  else if(avg<=42)L.push(N("Algunas relaciones siguen tensas, pero el equipo mantiene la disposición de trabajar junto."));
  return L}
};
const RelationshipEngine={tone(v){return v>=60?"cooperativa":v<=40?"tensa":"estable"}};

/* ===== EvaluationEngine ===== */
const REC=["Practica nombrar con precisión qué necesitas y qué información debes comunicar.","Ensaya formas de marcar desacuerdos sin descalificar: habla de la tarea o del hecho, no de la persona.","Entrena frases breves para decir hasta dónde puedes llegar y qué alternativa ofreces.","Antes de responder, pregunta o verifica los datos para entender la perspectiva de la otra persona.","Cuando algo no sea viable, acompaña tu límite con una alternativa o una propuesta de orden."];
const EvaluationEngine={
 results(a,b){const R=[];for(let i=a;i<b;i++)if(G.challengeResults[i])R.push(G.challengeResults[i]);return R},
 dims(R){const d=[0,0,0,0,0];R.forEach(r=>r.dims.split("").forEach((x,k)=>d[k]+=+x));return d},
 counts(R){const c={A:0,P:0,G:0,M:0};R.forEach(r=>c[r.cat]++);return c},
 rec(d,n){const p=d.map(v=>v/(2*n)*100),m=p.indexOf(Math.min(...p));return p[m]>=75?"Tus decisiones mostraron estrategias claras y variadas. Sigue practicando frases que combinen un límite con una alternativa concreta.":REC[m]},
 level(p){return p>=75?"muy presente":p>=50?"en desarrollo":"por fortalecer"},
 ending(){const g=G;if(g.pendingTasks>=4||g.unresolvedConflicts>=4||g.tension>=55)return"C";
  if(g.completedAgreements>=5&&g.pendingTasks<=2&&g.tension<=30&&g.unresolvedConflicts<=2)return"A";return"B"},
 badges(){const R=this.results(0,12),b=[],n=f=>R.filter(f).length;
  if(n(r=>r.dims[2]==2)>=2)b.push("Límites saludables");
  if(n(r=>r.dims[3]==2)>=2)b.push("Escucha activa");
  if(n(r=>r.dims[4]==2)>=2)b.push("Negociación");
  if(n(r=>r.cat=="A"&&r.dims[0]==2)>=3)b.push("Comunicación constructiva");
  const r12=G.challengeResults[11];if(r12&&(r12.j==1||r12.j==3))b.push("Coordinación de equipo");return b},
 conseq(){const g=G,L=[];
  L.push(g.pendingTasks?`Hay ${g.pendingTasks} tarea(s) pendiente(s) acumulada(s).`:"Las tareas están bajo control.");
  L.push(g.unresolvedConflicts?`Quedan ${g.unresolvedConflicts} conversación(es) o conflicto(s) sin resolver.`:"No quedan conflictos importantes sin resolver.");
  L.push(`Se han concretado ${g.completedAgreements} acuerdo(s).`);
  L.push(g.tension<=25?"El ambiente del equipo es de cooperación.":g.tension<=45?"Hay algo de tensión en el equipo.":"La tensión del equipo es alta.");
  L.push("Relaciones laborales: "+["Armando","Marcela","Hugo","Patricia"].map(k=>CH[k].n+" ("+RelationshipEngine.tone(g.relationships[k])+")").join(", ")+".");return L}
};

const DialogueSystem={
 play(sc,cast,lines,done){const my=RUN;let i=0;const go=()=>{if(my!==RUN)return;if(i>=lines.length)return done();const[w,t]=lines[i++],nar=w==""||w=="Narrador";
  app.innerHTML=`<div class="fade">${SceneRenderer.stage(sc,cast,nar?"":w)}<div class="dlg${nar?" nar":""}" aria-live="polite">${nar?"":`<div class="who">${w}</div>`}${CH[w]?`<div class="port">${SceneRenderer.sprite(w,"5 2 14 15")}</div>`:""}<div class="dt"><p id="tx"></p><button class="btn" id="nx">SALTAR ▶</button></div></div></div>`;
  const p=document.getElementById("tx"),b=document.getElementById("nx");let n=0,iv;
  const fin=()=>{clearInterval(iv);p.textContent=t;b.textContent="SIGUIENTE ▶";b.onclick=go};

};
function runChallenge(i){setProg(i);G.currentChallenge=i;G.currentChapter=Math.floor(i/4);const c=ChallengeData[i];DialogueSystem.play(c.sc,c.cast,c.lines,()=>showOptions(i))}
function showOptions(i){const c=ChallengeData[i];
 app.innerHTML=`<div class="fade">${SceneRenderer.stage(c.sc,c.cast,"Betty")}<div class="panel"><div class="tag">Capítulo ${Math.floor(i/4)+1} · Reto ${i%4+1} de 4 (${i+1}/12) · Tecla 1-4 para elegir</div><h2>${c.q}</h2>${c.o.map((o,j)=>`<button class="opt" data-j="${j}"><span>${"ABCD"[j]}</span>${o[0]}</button>`).join("")}</div></div>`;

 const c=ChallengeData[i],o=c.o[j];G.selectedAnswers[i]=j;

 if(c==2){const E=ENDS[G.ending];h+=`<div class="card"><h3>${E[0]}</h3>${E[1].map(l=>`<p>${l[0]?`<b>${l[0]}:</b> `:"<i>"}${l[1]}${l[0]?"":"</i>"}</p>`).join("")}</div>`}
 h+=`<div class="card"><h3>Pregunta de reflexión</h3><p>${e[2]}</p><p><small>Esta evaluación describe decisiones en una situación simulada; no es un diagnóstico ni una medición psicológica validada.</small></p></div>`;

 const R=EvaluationEngine.results(0,12),cn=EvaluationEngine.counts(R),ds=EvaluationEngine.dims(R);G.unlockedBadges=EvaluationEngine.badges();
 if(!G.ending)G.ending=EvaluationEngine.ending();const E=ENDS[G.ending],n3=G.totalScore>=1000?3:G.totalScore>=800?2:1;
 let h=`<div class="title"><h1>Ecomoda EN 8 BITS: MISIÓN COMPLETADA</h1><div class="stars" aria-label="${n3} de 3 estrellas">${"★".repeat(n3)}${"☆".repeat(3-n3)}</div></div><div class="card"><p>Has acompañado a Betty durante una jornada laboral llena de decisiones, desacuerdos y dificultades de coordinación.</p><p>Cada respuesta abrió posibilidades diferentes. Algunas facilitaron acuerdos; otras dejaron necesidades sin expresar o conflictos pendientes. Comprender esas diferencias permite reflexionar sobre cómo nos comunicamos en situaciones cotidianas.</p></div>`;
 h+=`<div class="card"><h3>Resultados</h3><p><b>Puntuación total: ${G.totalScore} / 1.200</b></p><p>${[0,1,2].map(c=>`Capítulo ${c+1}: ${(G.chapterResults[c]||{score:0}).score}/400`).join(" · ")}</p><p>Respuestas asertivas: ${cn.A} · pasivas: ${cn.P} · agresivas: ${cn.G} · pasivo-agresivas: ${cn.M}</p>`;
 DIM.forEach((d,k)=>{const p=Math.round(ds[k]/24*100);h+=`<div>${d}: ${EvaluationEngine.level(p)}</div><div class="bar"><i style="width:${p}%"></i></div>`});
 h+=`<h3>Insignias</h3><p>${G.unlockedBadges.length?G.unlockedBadges.map(b=>`<span class="badge">★ ${b}</span>`).join(""):"Aún no se desbloquearon insignias. Puedes volver a jugar y probar otras estrategias."}</p><p><small>Las insignias son reconocimientos educativos, no certificados de competencia psicológica.</small></p>`;
 h+=`<h3>${E[0]}</h3><h3>Consecuencias principales</h3><ul>${EvaluationEngine.conseq().map(x=>`<li>${x}</li>`).join("")}</ul><h3>Recomendación</h3><p>${EvaluationEngine.rec(ds,12)}</p></div>`;
 h+=`<div class="card"><h3>Preguntas finales</h3><ol><li>¿Qué tipo de situación te resultó más difícil de resolver?</li><li>¿Qué diferencia identificaste entre expresar un desacuerdo y atacar a una persona?</li><li>¿Qué frase o estrategia podrías utilizar en una situación real de estudio o trabajo?</li></ol><p><small>Este videojuego es una actividad educativa de reflexión sobre la comunicación interpersonal. Sus resultados describen decisiones tomadas en situaciones simuladas y no constituyen un diagnóstico psicológico ni una evaluación clínica de la personalidad.</small></p></div><button class="btn" id="again">VOLVER A JUGAR</button><button class="btn" id="rev">REVISAR MIS DECISIONES</button>`;
 IC.show(h);document.getElementById("again").onclick=()=>IC.ask("¿Volver a jugar? Se borrarán los resultados de esta partida.",GameReset.run);
 document.getElementById("rev").onclick=()=>ChapterSummary.render(0,true)}};

/* ===== GameReset / Inicio ===== */
const GameReset={run(){RUN++;setProg(0);G=GameState.fresh();home()}};
function home(){IC.show(`<div class="title">${SceneRenderer.stage("entrada",["Armando","Marcela","Hugo","Patricia"],"")}<h1>Ecomoda EN 8 BITS</h1><h2>MISIÓN ASERTIVIDAD</h2><p class="blink">▶ Tus decisiones cambian la historia ◀</p><button class="btn" id="b1">COMENZAR</button><button class="btn" id="b2">CÓMO JUGAR</button><button class="btn" id="b3">CRÉDITOS</button></div>`);
 document.getElementById("b1").onclick=()=>{G.stepIndex=0;runStep()};
 document.getElementById("b2").onclick=()=>info("CÓMO JUGAR",["Lee cada situación y elige la respuesta que consideres más adecuada. Tus decisiones afectarán las conversaciones, las relaciones laborales y el desarrollo de la historia.","No recibirás una puntuación inmediata. Al terminar cada capítulo podrás revisar tus decisiones, comprender sus consecuencias y explorar alternativas de comunicación.","No hay respuestas que definan tu personalidad. El objetivo es reflexionar sobre distintas estrategias de comunicación.","Puedes usar el ratón, el teclado (Tab, Enter, teclas 1 a 4) o la pantalla táctil. No hay temporizador."]);
 document.getElementById("b3").onclick=()=>info("CRÉDITOS",["Actividad educativa sobre comunicación asertiva.","UNIVERSIDAD DE PAMPLONA - ESTUDIANTES DE PSICOLOGÍA."])}
function info(t,P){IC.show(`<div class="card"><h2>${t}</h2>${P.map(p=>`<p>${p}</p>`).join("")}<button class="btn" id="bb">VOLVER</button></div>`);document.getElementById("bb").onclick=home}
document.getElementById("hHome").onclick=()=>IC.ask("¿Volver al inicio? Se perderá el progreso de esta partida.",GameReset.run);
document.getElementById("hReset").onclick=()=>IC.ask("¿Reiniciar la partida? Se borrarán todas tus decisiones y resultados.",GameReset.run);
home();
</script></body></html>
